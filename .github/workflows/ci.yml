name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.50.0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  native-bridge:
    # compile-checks the C bridge against CAMO's wallet API header
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone --depth 1 https://github.com/thedifference7717-sys/camo.git camo
      - run: g++ -std=c++17 -Wall -Wextra -Werror -fsyntax-only -Icamo/src native/camo_wallet_ffi.cpp

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: ghillie-android-demo
          path: build/app/outputs/flutter-apk/app-debug.apk

  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
      - run: flutter build ios --debug --no-codesign
      - run: cd build/ios/iphoneos && zip -qr ghillie-ios-unsigned.zip Runner.app
      - uses: actions/upload-artifact@v4
        with:
          name: ghillie-ios-demo-unsigned
          path: build/ios/iphoneos/ghillie-ios-unsigned.zip
